
<!-- David Kenny-Vaughan, Subjects Calculator, 30.11.2025-->
<!--Create an application that asks a user to enter how many subjects they have.
The application should then ask the user to enter the results for each subject.
Store these results in an array and print them back to the user along with their overall average and grade for each module.-->



<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">

 		<title>Subject Array Calculator</title>

 		<link rel="stylesheet" href="style.css">

 		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


		</head>

		<body class="main">

			<div class="container-head">
				<div class="row">
					<div class="col-sm-12">
						<h1>Subjects Calculator (using Arrays)</h1>
					</div>
				</div>
			</div>

			<div class="container">
				<div class="row" id="row1">
					<div class="col-sm-12"></br>

						<p>To determine your grades for the year, please enter the below information</p>
						<p>How many subjects did you take?</p>
						 <input type="number" id="numSubjects" name="numS"><br>
						 <button onclick="setSubjects()" type="button" class="button" id="subjectButton">Enter</button>

						 </div>
						 </div>
					<div class="row">
					<div class="col-sm-12" id="resultInput"></br>
					</div>
					</div>

					<div class="row">
										<div class="col-sm-12" id="finalResults"></br>
										</div>
										</div>



				</div>


   		 <script src="jscript2.js"></script>


	</body>


</html>
